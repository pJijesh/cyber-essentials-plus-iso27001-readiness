name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke test the quick start
        run: |
          python -m readiness init --out assessment.csv
          python -m readiness score --workbook assessment.csv --out output --as-of 2026-11-11
          python -m readiness sites --sites examples/sites.csv --out output
